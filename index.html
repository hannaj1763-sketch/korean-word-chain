<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JJ 끝말잇기</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-soft: #273449;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --mic: #ef4444;
      --mic-glow: rgba(239, 68, 68, 0.35);
      --green: #22c55e;
      --amber: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 70%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 14px 24px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* 상단 상태 및 컨트롤 바 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      backdrop-filter: blur(8px);
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .badge.combo {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: var(--card-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .ctrl-btn.active {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.5);
      color: #86efac;
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    /* 메인 제시어 & 일러스트 카드 */
    .main-card {
      background: linear-gradient(160deg, #1e293b 0%, #162033 100%);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .turn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(129, 140, 248, 0.18);
      color: #c7d2fe;
      margin-bottom: 12px;
    }

    .turn-pill.speaking {
      background: rgba(34, 197, 94, 0.22);
      color: #86efac;
      animation: pulseSoft 1.2s infinite;
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .art-box {
      width: 170px;
      height: 170px;
      border-radius: 22px;
      background: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
    }

    .art-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .word-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .current-word {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .speak-now-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .speak-now-btn:active {
      transform: scale(0.92);
    }

    .next-char-guide {
      font-size: 14px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .char-chip {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 900;
      font-size: 16px;
      padding: 2px 10px;
      border-radius: 10px;
    }

    .char-chip.alt {
      background: #a78bfa;
      color: #0f172a;
    }

    .status-msg {
      margin-top: 10px;
      min-height: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #fbbf24;
    }

    /* 사용자 입력 & 마이크 영역 */
    .input-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .live-transcript {
      font-size: 12.5px;
      color: #93c5fd;
      text-align: center;
      min-height: 18px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .word-input {
      flex: 1;
      min-width: 0;
      background: #0f172a;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 17px;
      font-weight: 700;
      outline: none;
    }

    .word-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .mic-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mic-btn {
      flex: 1;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px var(--mic-glow);
      transition: transform 0.15s, background 0.2s;
    }

    .mic-btn.listening {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.25);
      animation: micPulse 1.1s infinite;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .hint-btn {
      background: var(--card-soft);
      color: #fde047;
      border: 1px solid rgba(253, 224, 71, 0.35);
      border-radius: 16px;
      padding: 14px 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 맨 아래: 이어진 그림 & 단어 갤러리 */
    .history-section {
      margin-top: auto;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .history-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .hist-card {
      flex: none;
      width: 82px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      text-align: center;
    }

    .hist-card.ai {
      border-color: rgba(129, 140, 248, 0.45);
    }

    .hist-card.user {
      border-color: rgba(56, 189, 248, 0.45);
    }

    .hist-thumb {
      width: 68px;
      height: 68px;
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto 5px;
    }

    .hist-word {
      font-size: 12.5px;
      font-weight: 800;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hist-who {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .hist-arrow {
      color: #64748b;
      font-weight: 900;
      font-size: 16px;
      flex: none;
    }

    /* 휴대폰 크기 맞춤 */
    body { padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    .topbar { flex-wrap: wrap; }
    .controls { flex-wrap: wrap; justify-content: flex-end; }
    .art-box { width: clamp(96px, 22vh, 170px); height: clamp(96px, 22vh, 170px); }
    .current-word { font-size: clamp(26px, 8vw, 36px); word-break: keep-all; }
    .hint-btn:disabled { opacity: .45; }
    @media (max-width: 360px) {
      .ctrl-btn { padding: 6px 7px; font-size: 11px; }
      .badge { padding: 3px 8px; font-size: 12px; }
      .send-btn { padding: 12px 12px; }
      .hint-btn { padding: 12px 10px; font-size: 13px; }
      .mic-btn { font-size: 15px; padding: 12px; }
    }
    @media (max-height: 640px) {
      .main-card { padding: 12px; }
      .turn-pill { margin-bottom: 8px; }
      .art-box { margin-bottom: 8px; }
      .hist-card { width: 62px; padding: 4px; } .hist-thumb { width: 46px; height: 46px; margin-bottom: 3px; }
      .art-box { width: 84px; height: 84px; border-radius: 16px; }
      .current-word { font-size: 26px; } .word-row { margin-bottom: 4px; }
      .status-msg { margin-top: 6px; }
      .app { gap: 8px; } .input-panel { padding: 9px; gap: 7px; } .history-section { padding: 9px; }
      .word-input, .send-btn { padding-top: 10px; padding-bottom: 10px; } .mic-btn, .hint-btn { padding-top: 11px; padding-bottom: 11px; }
      .live-transcript:empty { display: none; }
      .history-head { margin-bottom: 6px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .app { max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
      .topbar, .history-section { grid-column: 1 / -1; }
      .art-box { width: 90px; height: 90px; }
    }
    .word-meaning { font-size: 13px; color: #b9b9d0; line-height: 1.45; margin: -4px auto 8px; max-width: 92%; min-height: 0; word-break: keep-all; text-align: center; }
  .word-meaning:empty { display: none; }
  .src-note { font-size: 11px; color: #9a9aac; text-align: center; margin: 10px 0 4px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="app">
    <!-- 상단 바 -->
    <div class="topbar">
      <div class="stats">
        <span class="badge" id="scoreBadge">점수 0</span>
        <span class="badge combo" id="comboBadge">0 콤보</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn active" id="ttsToggleBtn" onclick="toggleTTS()">🔊 음성 켜짐</button>
        <button class="ctrl-btn" id="autoMicBtn" onclick="toggleAutoMic()">🔄 연속대화</button>
        <button class="ctrl-btn" id="levelBtn" onclick="toggleLevel()" title="쉬움: AI가 쉬운 단어만 / 보통: 학교 낱말까지">🌱 쉬움</button>
        <button class="ctrl-btn" onclick="resetGame()">↻ 새게임</button>
      </div>
    </div>

    <!-- 메인 제시어 & 그림 카드 -->
    <div class="main-card">
      <div class="turn-pill" id="turnPill">🤖 AI 제시어</div>
      <div class="art-box" id="mainArtBox"></div>
      <div class="word-row">
        <div class="current-word" id="currentWord">사과</div>
        <button class="speak-now-btn" id="replayBtn" onclick="replayCurrentWord()" title="단어 다시 듣기">🔊</button>
      </div>
      <div class="word-meaning" id="wordMeaning"></div>
      <div class="next-char-guide" id="nextCharGuide"></div>
      <div class="status-msg" id="statusMsg">마이크를 누르거나 단어를 입력해 주세요!</div>
    </div>

    <!-- 입력 & 마이크 컨트롤 -->
    <div class="input-panel">
      <div class="live-transcript" id="liveTranscript"></div>
      <div class="input-row">
        <input
          type="text"
          id="wordInput"
          class="word-input"
          placeholder="단어 입력 후 전송"
          autocomplete="off"
          onkeydown="if(event.key==='Enter' && !event.isComposing) submitTypedWord()"
        />
        <button class="send-btn" onclick="submitTypedWord()">전송</button>
      </div>
      <div class="mic-row">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">
          <span id="micIcon">🎤</span>
          <span id="micLabel">눌러서 말하기</span>
        </button>
        <button class="hint-btn" id="hintBtn" onclick="useHint()">💡 힌트 (3)</button>
      </div>
    </div>

    <!-- 맨 아래: 이어진 그림 & 단어 -->
    <div class="history-section">
      <div class="history-head">
        <span>🖼️ 이어진 그림 & 단어</span>
        <span id="chainCount">1개 연결됨</span>
      </div>
      <div class="history-strip" id="historyStrip"></div>
      <div class="src-note">낱말·뜻 출처: 한국교육학술정보원 「모두의한국어 단어장」 (공공데이터포털)</div>
    </div>
  </div>

    const KNOWN = new Set(BIG_WORDS);
    let level = 'easy';
    try { level = localStorage.getItem('jj_wordchain_level') === 'normal' ? 'normal' : 'easy'; } catch (e) {}
    const pool = () => level === 'easy' ? ALL_WORDS : BIG_WORDS;
    function toggleLevel() {
      level = level === 'easy' ? 'normal' : 'easy';
      try { localStorage.setItem('jj_wordchain_level', level); } catch (e) {}
      paintLevel();
      resetGame();
    }
    function paintLevel() {
      const b = document.getElementById('levelBtn');
      if (b) b.textContent = level === 'easy' ? '🌱 쉬움' : '📚 보통';
    }
    const K_BEST = 'jj_wordchain_best';

    // 상태
    let usedWords = new Set();
    let historyList = [];          // { word, who: 'ai' | 'user' }
    let currentWord = '';
    let score = 0, combo = 0, hintsLeft = 3;
    let ttsEnabled = true, autoMicEnabled = false, isListening = false, busy = false;
    let recognition = null, ttsTimer = null;
    const $ = id => document.getElementById(id);
    const Native = (() => { try { return window.AtelierApp || (window.parent && window.parent.AtelierApp) || null; } catch (e) { return null; } })();

    // ---------- 두음법칙: 녀→여, 력→역, 라→나 ... ----------
    function getDueumChars(char) {
      const code = char.charCodeAt(0);
      if (code < 0xAC00 || code > 0xD7A3) return [char];
      const offset = code - 0xAC00;
      const cho = Math.floor(offset / 588), jung = Math.floor((offset % 588) / 28), jong = offset % 28;
      const results = new Set([char]);
      const yVowels = [2, 3, 6, 7, 12, 17, 20];   // ㅑ ㅒ ㅕ ㅖ ㅛ ㅠ ㅣ
      const make = c => String.fromCharCode(0xAC00 + c * 588 + jung * 28 + jong);
      if (cho === 5) results.add(yVowels.includes(jung) ? make(11) : make(2));   // ㄹ → ㅇ / ㄴ
      else if (cho === 2 && yVowels.includes(jung)) results.add(make(11));        // ㄴ → ㅇ
      return Array.from(results);
    }
    const lastCharOf = w => w[w.length - 1];
    const allowedStarts = w => getDueumChars(lastCharOf(w));
    const isHangulWord = w => /^[가-힣]{2,8}$/.test(w);

    // ---------- 단어 그림 카드 (이모지 + 단어 색 배경) ----------
    function emojiFor(word) {
      let emoji = EMOJI_MAP.get(word);
      if (!emoji) for (const [k, v] of EMOJI_MAP.entries()) if (k.length >= 2 && (word.includes(k) || k.includes(word))) { emoji = v; break; }
      if (!emoji) {
        const fallbackIcons = ['🎨', '✨', '🌟', '🎈', '🍀', '🎵', '📚', '🌈', '🎁', '🧸'];
        let hash = 0; for (let i = 0; i < word.length; i++) hash = (hash * 31 + word.charCodeAt(i)) >>> 0;
        emoji = fallbackIcons[hash % fallbackIcons.length];
      }
      return emoji;
    }
    function createWordIllustrationSVG(word) {
      let hash = 7; for (let i = 0; i < word.length; i++) hash = (hash * 31 + word.charCodeAt(i)) >>> 0;
      const h1 = hash % 360, h2 = (h1 + 50) % 360, id = 'g' + hash;
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${word}">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h1},70%,32%)"/><stop offset="1" stop-color="hsl(${h2},70%,18%)"/></linearGradient></defs>
        <rect width="100" height="100" fill="url(#${id})"/>
        <circle cx="50" cy="48" r="30" fill="rgba(255,255,255,.10)"/>
        <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="44">${emojiFor(word)}</text>
      </svg>`;
    }

    // ---------- 말하기 (앱에서는 앱 목소리, 웹에서는 브라우저 목소리) ----------
    function speak(text, after) {
      clearTimeout(ttsTimer);
      const done = () => { if (after) after(); };
      if (!ttsEnabled) { done(); return; }
      try { if (Native && typeof Native.speak === 'function' && Native.speak(text, .9) === 'ok') { ttsTimer = setTimeout(done, 700 + text.length * 260); return; } } catch (e) {}
      if (!('speechSynthesis' in window)) { done(); return; }
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = .9;
        let fired = false; const fin = () => { if (!fired) { fired = true; done(); } };
        u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
        ttsTimer = setTimeout(fin, 1200 + text.length * 350);           // onend 가 안 오는 기기 대비
      } catch (e) { done(); }
    }
    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      const b = $('ttsToggleBtn'); b.classList.toggle('active', ttsEnabled); b.textContent = ttsEnabled ? '🔊 음성 켜짐' : '🔇 음성 꺼짐';
      if (!ttsEnabled) try { speechSynthesis.cancel(); } catch (e) {}
    }
    function replayCurrentWord() { if (currentWord) { const t = ttsEnabled; ttsEnabled = true; speak(currentWord); ttsEnabled = t; } }

    // ---------- 음성 인식 ----------
    // 1순위: AGJJ 앱 안이면 휴대폰 자체 음성 인식(앱 기능 Native.listen)
    // 2순위: 크롬 등 브라우저의 음성 인식(webkitSpeechRecognition)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const HAS_NATIVE_LISTEN = !!(Native && typeof Native.listen === 'function');
    const IN_APP = !!(Native && typeof Native.isApp === 'function');
    const CAN_LISTEN = HAS_NATIVE_LISTEN || (!!SR && !IN_APP);
    let listenSafety = null;

    function handleHeard(alts) {
      alts = (alts || []).filter(Boolean);
      if (!alts.length) { setStatus('소리가 잘 안 들렸어요. 다시 눌러서 말해 주세요.'); return; }
      const pick = alts.map(cleanSpoken).find(w => isHangulWord(w) && allowedStarts(currentWord).includes(w[0])) || cleanSpoken(alts[0]);
      if (pick) submitWord(pick, true);
      else setStatus(`"${alts[0]}"(으)로 들렸어요. 한 번 더 또박또박 말해 주세요.`);
    }

    // 앱(안드로이드)에서 오는 음성 인식 결과
    function onNativeSpeech(type, text, alts) {
      if (type === 'ready') { $('liveTranscript').textContent = '🎙 말해 보세요'; return; }
      if (type === 'partial') { $('liveTranscript').textContent = '🎙 ' + text; return; }
      if (type === 'end') return;
      if (!isListening) return;
      if (type === 'final') {
        $('liveTranscript').textContent = '🎙 ' + text;
        stopListening(true);
        handleHeard(alts && alts.length ? alts : [text]);
        return;
      }
      if (type === 'error') {
        stopListening(true);
        const msg = {
          permission: '마이크 권한이 필요해요. 휴대폰 설정 > 애플리케이션 > AGJJ > 권한에서 마이크를 허용해 주세요.',
          unavailable: '이 휴대폰에 음성 인식 기능이 없어요. 구글 앱을 설치·업데이트하거나 글자로 입력해 주세요.',
          '7': '무슨 말인지 잘 못 알아들었어요. 다시 눌러서 또박또박 말해 주세요.',
          '6': '소리가 안 들렸어요. 마이크를 누르고 바로 말해 주세요.',
          '2': '인터넷 연결을 확인해 주세요. 음성 인식은 인터넷이 필요해요.',
          '9': '마이크 권한이 필요해요. 휴대폰 설정에서 AGJJ 마이크를 허용해 주세요.',
          '8': '음성 인식이 아직 바빠요. 잠깐 뒤 다시 눌러 주세요.'
        }[text] || `음성 인식이 잘 안 됐어요(코드 ${text}). 다시 눌러 주세요.`;
        setStatus(msg);
      }
    }
    try { window.onAtelierSpeech = onNativeSpeech; } catch (e) {}
    try { if (window.parent && window.parent !== window) window.parent.onAtelierSpeech = onNativeSpeech; } catch (e) {}

    function setupRecognition() {
      if (!SR) return null;
      const r = new SR(); r.lang = 'ko-KR'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
      r.onresult = e => {
        let txt = '', final = false;
        for (let i = e.resultIndex; i < e.results.length; i++) { txt += e.results[i][0].transcript; if (e.results[i].isFinal) final = true; }
        $('liveTranscript').textContent = '🎙 ' + txt;
        if (final) {
          const alts = Array.from(e.results[e.results.length - 1]).map(a => a.transcript);
          stopListening(); handleHeard(alts);
        }
      };
      r.onerror = e => {
        stopListening();
        const msg = {
          'not-allowed': '마이크 사용이 막혀 있어요. 주소창 옆 🔒 > 권한에서 마이크를 허용해 주세요.',
          'service-not-allowed': '이 브라우저에서는 음성 인식을 쓸 수 없어요. 크롬에서 열거나 글자로 입력해 주세요.',
          'no-speech': '소리가 잘 안 들렸어요. 다시 눌러서 말해 주세요.',
          'audio-capture': '마이크를 찾지 못했어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요.',
          'network': '인터넷 연결을 확인해 주세요. 음성 인식은 인터넷이 필요해요.',
          'aborted': ''
        }[e.error];
        if (msg !== '') setStatus(msg || `음성 인식이 잘 안 됐어요(${e.error}). 다시 눌러 주세요.`);
      };
      r.onend = () => { if (isListening) { stopListening(); setStatus('다 듣지 못했어요. 다시 눌러서 말해 주세요.'); } };
      return r;
    }
    function cleanSpoken(s) { return String(s || '').replace(/[^가-힣\s]/g, '').trim().split(/\s+/).pop() || ''; }
    function toggleMic() { isListening ? stopListening() : startListening(); }
    function startListening() {
      if (busy) { setStatus('AI가 말하는 중이에요. 끝나면 눌러 주세요.'); return; }
      if (!CAN_LISTEN) {
        setStatus(IN_APP
          ? '앱을 최신 버전으로 업데이트하면 마이크로 말할 수 있어요. 지금은 글자로 입력해 주세요.'
          : '이 브라우저에서는 음성 인식이 안 돼요. 크롬에서 열거나 글자로 입력해 주세요.');
        $('wordInput').focus(); return;
      }
      try { speechSynthesis.cancel(); } catch (e) {}
      try { Native && Native.stopSpeak && Native.stopSpeak(); } catch (e) {}
      if (HAS_NATIVE_LISTEN) {
        try { Native.listen('ko-KR'); } catch (e) { setStatus('마이크를 켜지 못했어요. 글자로 입력해 주세요.'); return; }
      } else {
        recognition = recognition || setupRecognition();
        try { recognition.start(); }
        catch (e) {
          try { recognition.abort(); } catch (x) {}
          recognition = setupRecognition();
          try { recognition.start(); } catch (x) { setStatus('마이크를 켜지 못했어요. 잠깐 뒤 다시 눌러 주세요.'); return; }
        }
      }
      isListening = true; $('micBtn').classList.add('listening'); $('micIcon').textContent = '👂'; $('micLabel').textContent = '듣고 있어요… (누르면 멈춤)';
      $('liveTranscript').textContent = '🎙 말해 보세요';
      setStatus('지금 말해 보세요!');
      clearTimeout(listenSafety);
      listenSafety = setTimeout(() => { if (isListening) { stopListening(); setStatus('시간이 지나서 마이크를 껐어요. 다시 눌러서 말해 주세요.'); } }, 12000);
    }
    function stopListening(fromNative) {
      isListening = false; clearTimeout(listenSafety);
      if (HAS_NATIVE_LISTEN) { if (!fromNative) { try { Native.stopListen && Native.stopListen(); } catch (e) {} } }
      else { try { recognition && recognition.stop(); } catch (e) {} }
      $('micBtn').classList.remove('listening'); $('micIcon').textContent = '🎤'; $('micLabel').textContent = '눌러서 말하기';
    }
    function toggleAutoMic() {
      autoMicEnabled = !autoMicEnabled; $('autoMicBtn').classList.toggle('active', autoMicEnabled);
      setStatus(autoMicEnabled ? '연속대화 켜짐: AI가 말하고 나면 마이크가 저절로 켜져요.' : '연속대화 꺼짐');
      if (!CAN_LISTEN && autoMicEnabled) { autoMicEnabled = false; $('autoMicBtn').classList.remove('active'); setStatus('이 기기에서는 음성 인식이 안 돼서 연속대화를 쓸 수 없어요.'); }
    }

    // ---------- 화면 ----------
    function setStatus(t) { $('statusMsg').textContent = t; }
    function renderMain(who) {
      $('mainArtBox').innerHTML = createWordIllustrationSVG(currentWord);
      $('currentWord').textContent = currentWord;
      const mn = MEANING.get(currentWord);
      $('wordMeaning').textContent = mn ? '뜻: ' + mn : '';
      const pill = $('turnPill'); pill.textContent = who === 'ai' ? '🤖 AI 제시어' : '🧒 내 단어'; pill.classList.toggle('speaking', who === 'ai');
      const starts = allowedStarts(currentWord);
      $('nextCharGuide').innerHTML = '다음 단어는 ' + starts.map((c, i) => `<span class="char-chip ${i ? 'alt' : ''}">${c}</span>`).join(' 또는 ') + ' (으)로 시작해요';
      $('scoreBadge').textContent = `점수 ${score}`;
      $('comboBadge').textContent = `${combo} 콤보`;
      $('hintBtn').textContent = `💡 힌트 (${hintsLeft})`; $('hintBtn').disabled = hintsLeft <= 0;
      renderHistory();
    }
    function renderHistory() {
      const strip = $('historyStrip');
      strip.innerHTML = historyList.map((h, i) => `${i ? '<span class="hist-arrow">→</span>' : ''}
        <div class="hist-card ${h.who}"><div class="hist-thumb">${createWordIllustrationSVG(h.word)}</div>
        <div class="hist-word">${h.word}</div><div class="hist-who">${h.who === 'ai' ? '🤖 AI' : '🧒 나'}</div></div>`).join('');
      $('chainCount').textContent = `${historyList.length}개 연결됨`;
      strip.scrollLeft = strip.scrollWidth;
    }
    function pop(el) { el.animate([{ transform: 'scale(.85)', opacity: .4 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, easing: 'ease-out' }); }

    // ---------- 게임 진행 ----------
    function candidatesFor(word) {
      const starts = allowedStarts(word);
      return pool().filter(w => !usedWords.has(w) && starts.includes(w[0]));
    }
    function aiPick(word) {
      // 다음 사람이 이어갈 수 있는 단어를 먼저 골라요 (아이가 막히지 않게)
      const c = candidatesFor(word); if (!c.length) return null;
      const P = pool();
      const good = c.filter(w => P.some(x => x !== w && !usedWords.has(x) && allowedStarts(w).includes(x[0])));
      const pool = good.length ? good : c;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function submitTypedWord() {
      const inp = $('wordInput'); const w = inp.value.trim().replace(/\s+/g, '');
      if (!w) { setStatus('단어를 입력해 주세요!'); return; }
      submitWord(w, false);
    }
    function submitWord(word, spoken) {
      if (busy) return;
      $('liveTranscript').textContent = spoken ? `🎙 들은 말: ${word}` : '';
      if (!isHangulWord(word)) return reject('한글 두 글자 이상으로 말해 주세요.');
      const starts = allowedStarts(currentWord);
      if (!starts.includes(word[0])) return reject(`'${starts.join("' 또는 '")}'(으)로 시작해야 해요.`);
      if (usedWords.has(word)) return reject(`'${word}'는 벌써 나왔어요. 다른 단어!`);
      const known = KNOWN.has(word);
      $('wordInput').value = '';
      usedWords.add(word); historyList.push({ word, who: 'user' });
      combo++; score += (known ? 10 : 6) + Math.min(10, (combo - 1) * 2);
      currentWord = word; renderMain('user'); pop($('mainArtBox'));
      setStatus(known ? `좋아요! +${10 + Math.min(10, (combo - 1) * 2)}점` : `처음 보는 단어지만 인정! 사전에 더 넣을게요 😊`);
      busy = true;
      setTimeout(aiTurn, 900);
    }
    function reject(msg) { combo = 0; setStatus('🙅 ' + msg); $('comboBadge').textContent = '0 콤보'; pop($('statusMsg')); speak(msg.replace(/'/g, '')); return false; }
    function aiTurn() {
      const w = aiPick(currentWord);
      if (!w) {
        busy = false; score += 50; renderMain('user'); saveBest();
        setStatus(`🎉 AI가 '${allowedStarts(currentWord).join('/')}'(으)로 시작하는 단어를 못 찾았어요! 내가 이겼어요 (+50)`);
        speak('내가 졌어요! 정말 잘했어요.');
        setTimeout(() => newRound(false), 2600);
        return;
      }
      usedWords.add(w); historyList.push({ word: w, who: 'ai' }); currentWord = w;
      renderMain('ai'); pop($('mainArtBox'));
      if (!candidatesFor(w).length) setStatus(`AI: '${w}'! 이을 단어가 사전에 없으면 💡 힌트 대신 아는 단어를 말해 봐요.`);
      else setStatus(`AI: '${w}'! 이제 내 차례예요.`);
      speak(w, () => { busy = false; $('turnPill').classList.remove('speaking'); if (autoMicEnabled) startListening(); });
      if (!ttsEnabled) busy = false;
    }
    function useHint() {
      if (hintsLeft <= 0 || busy) return;
      const c = candidatesFor(currentWord);
      if (!c.length) { setStatus('사전에 있는 이을 단어가 없어요. 아는 단어로 도전해 봐요!'); return; }
      hintsLeft--; const w = c[Math.floor(Math.random() * c.length)];
      setStatus(`💡 힌트: ${emojiFor(w)} ${w[0]}${'○'.repeat(w.length - 1)} (${w.length}글자)`);
      $('hintBtn').textContent = `💡 힌트 (${hintsLeft})`; $('hintBtn').disabled = hintsLeft <= 0;
    }
    function saveBest() { try { const b = +localStorage.getItem(K_BEST) || 0; if (score > b) localStorage.setItem(K_BEST, score); } catch (e) {} }
    function newRound(resetScore) {
      stopListening(); busy = false;
      usedWords = new Set(); historyList = [];
      if (resetScore) { saveBest(); score = 0; combo = 0; hintsLeft = 3; }
      const starters = pool().filter(w => candidatesFor(w).length >= 2);
      currentWord = starters[Math.floor(Math.random() * starters.length)] || '사과';
      usedWords.add(currentWord); historyList.push({ word: currentWord, who: 'ai' });
      renderMain('ai');
      let best = 0; try { best = +localStorage.getItem(K_BEST) || 0; } catch (e) {}
      setStatus(`마이크를 누르거나 단어를 입력해 주세요!${best ? ` (최고 ${best}점)` : ''}`);
    }
    function resetGame() { newRound(true); speak(currentWord); }

    paintLevel();
    newRound(true);
    if (!CAN_LISTEN) { $('micLabel').textContent = IN_APP ? '앱 업데이트 후 말하기 가능' : '음성 인식 안 됨 · 글자로 입력'; $('micBtn').style.opacity = .55; }
  </script>
</body>
</html>
